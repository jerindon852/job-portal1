apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-portal-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-portal-backend
  template:
    metadata:
      labels:
        app: job-portal-backend
    spec:
      containers:
        - name: backend
          image: job-portal-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
